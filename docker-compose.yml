services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: Byld
      POSTGRES_PASSWORD: root
      POSTGRES_DB: Byld-intern
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready  -U Byld -d Byld-intern"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - backup:/var/lib/postgresql/data
    

volumes:
  backup: